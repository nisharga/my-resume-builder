<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Highlight Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Main Resume Document Card -->
  <g filter="url(#shadow)">
    <rect x="128" y="96" width="220" height="300" rx="20" fill="#FFFFFF" />
    
    <!-- Header / Avatar Circle -->
    <circle cx="176" cy="156" r="22" fill="url(#accentGrad)" opacity="0.2" />
    <circle cx="176" cy="156" r="14" fill="url(#accentGrad)" />

    <!-- Name & Title Lines -->
    <rect x="212" y="144" width="100" height="10" rx="5" fill="#1E293B" />
    <rect x="212" y="162" width="60" height="8" rx="4" fill="#94A3B8" />

    <!-- Resume Content Placeholders -->
    <rect x="160" y="204" width="156" height="8" rx="4" fill="#CBD5E1" />
    <rect x="160" y="224" width="130" height="8" rx="4" fill="#CBD5E1" />
    <rect x="160" y="244" width="144" height="8" rx="4" fill="#CBD5E1" />
    
    <rect x="160" y="280" width="156" height="8" rx="4" fill="#E2E8F0" />
    <rect x="160" y="300" width="110" height="8" rx="4" fill="#E2E8F0" />
    <rect x="160" y="320" width="138" height="8" rx="4" fill="#E2E8F0" />
  </g>

  <!-- Dynamic Builder Pen / Wand -->
  <g filter="url(#shadow)">
    <!-- Pen Body -->
    <path d="M360 160 L390 130 C398 122 410 122 418 130 L422 134 C430 142 430 154 422 162 L392 192 Z" fill="url(#accentGrad)" />
    <!-- Pen Nib -->
    <path d="M360 160 L330 220 L392 192 Z" fill="#1D4ED8" />
    <!-- Nib Tip -->
    <path d="M330 220 L345 205 L355 215 Z" fill="#60A5FA" />
  </g>

  <!-- Sparkle Accent -->
  <path d="M320 120 L324 132 L336 136 L324 140 L320 152 L316 140 L304 136 L316 132 Z" fill="url(#sparkGrad)" />
</svg>
