<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Cat Face -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <path d="M128 210 L146 92 L230 172 Z" fill="#F59E42" />
    <path d="M384 210 L366 92 L282 172 Z" fill="#F59E42" />
    <path d="M150 196 L160 124 L212 174 Z" fill="#FFAABE" />
    <path d="M362 196 L352 124 L300 174 Z" fill="#FFAABE" />

    <!-- Head -->
    <ellipse cx="256" cy="286" rx="154" ry="138" fill="#F59E42" />
  </g>

  <!-- Forehead Stripes -->
  <rect x="222" y="154" width="12" height="48" rx="6" fill="#D67828" />
  <rect x="250" y="152" width="12" height="60" rx="6" fill="#D67828" />
  <rect x="278" y="154" width="12" height="48" rx="6" fill="#D67828" />

  <!-- Muzzle -->
  <circle cx="220" cy="336" r="40" fill="#FFFAF5" />
  <circle cx="292" cy="336" r="40" fill="#FFFAF5" />

  <!-- Eyes -->
  <ellipse cx="198" cy="268" rx="26" ry="31" fill="#6EC878" />
  <ellipse cx="314" cy="268" rx="26" ry="31" fill="#6EC878" />
  <ellipse cx="198" cy="268" rx="9" ry="26" fill="#1E1E28" />
  <ellipse cx="314" cy="268" rx="9" ry="26" fill="#1E1E28" />
  <circle cx="205" cy="256" r="6" fill="#FFFFFF" />
  <circle cx="321" cy="256" r="6" fill="#FFFFFF" />

  <!-- Nose & Mouth -->
  <path d="M241 304 L271 304 L256 322 Z" fill="#FFAABE" />
  <path d="M256 322 Q256 344 236 344 M256 322 Q256 344 276 344" fill="none" stroke="#1E1E28" stroke-width="6" stroke-linecap="round" />

  <!-- Whiskers -->
  <g stroke="#1E1E28" stroke-width="5" stroke-linecap="round">
    <line x1="194" y1="326" x2="80" y2="306" />
    <line x1="194" y1="338" x2="78" y2="340" />
    <line x1="194" y1="350" x2="84" y2="374" />
    <line x1="318" y1="326" x2="432" y2="306" />
    <line x1="318" y1="338" x2="434" y2="340" />
    <line x1="318" y1="350" x2="428" y2="374" />
  </g>
</svg>
